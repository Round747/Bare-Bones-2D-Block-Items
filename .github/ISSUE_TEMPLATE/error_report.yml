name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: ["bug"]
assignees:
  - Round747
type: bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What is the issue, and when does this occur?
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Pack Version
      options:
        - 2.0
        - 1.5.1
        - 1.5
        - 1.4.3
        - 1.4.2
        - 1.4.1
        - 1.4
        - 1.3.1
        - 1.3
        - 1.2.1
        - 1.2
        - 1.1
        - 1.0
      default: 0
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Game Version
    validations:
      required: true
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: Only if applicable, add screenshots to help explain your problem.
    validations:
      required: false